<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GWA Calculator</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-image: url('https://www.wanderu.com/blog/wp-content/uploads/2023/08/HeaderImage.jpg');
            background-repeat: no-repeat;
         background-size: cover;
         background-attachment: fixed;
         margin: 0;
         padding: 0;
        }
        .calculator-box {
            background-color: #e8dcc9;
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #3E0703;
        }
        input {
            margin: 5px;
            padding: 8px;
            border-radius: 10px;
            border: 2px solid #3E0703;
        }
        button {
            margin-top: 10px;
            border-radius: 12px;
            border: 2px solid #6c1313;
        }
        .top-nav {
    background-color: #e8dcc9; 
    padding: 12px 0;
    border-bottom: 2px solid #3E0703;
       }

       .top-nav a {
    text-decoration: none;
    color: #3E0703;
    font-weight: bold;
    margin: 0 10px;
      }

      .top-nav a:hover {
    text-decoration: underline;
      }
        h2{
            font-family: Georgia;
            color: #6c1313
        }
    </style>
</head>

<body>

<nav class="top-nav text-center">
    <a href="index.html">Home</a> |
    <a href="gwa.html">GWA Calculator</a> |
    <a href="clubs.html">School Clubs</a>
</nav>

<div class="calculator-box text-center">
    <h2 style="color: #6c1313">Student Grade Calculator</h2>

    <input type="text" id="First_name" placeholder="First Name">
    <input type="text" id="Last_name" placeholder="Last Name"><br>

    <input type="number" id="Science" placeholder="Science">
    <input type="number" id="Math" placeholder="Math">
    <input type="number" id="English" placeholder="English"><br>

    <input type="number" id="Filipino" placeholder="Filipino">
    <input type="number" id="ICT" placeholder="ICT">
    <input type="number" id="PE" placeholder="PE"><br>

    <button py-click="general_weighted_average">Calculate GWA</button>

    <div id="output1" class="mt-3"></div>
</div>

<script type="py" src="gwa.py"></script>
</body>
</html>
